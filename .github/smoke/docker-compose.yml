# Smoke-test stack for CI.
#
# Mirrors self-hosting/docker-compose.template.yml — the stack self-hosters
# actually run — but pins each app to an image built by this workflow run and
# publishes ports so the runner can talk to them.
#
# Deliberately different from the template in two ways:
#   - no `restart: always`. A crash-looping container must fail the job, not be
#     silently revived until the healthcheck happens to pass.
#   - no `.env` file. Everything is inline so the stack is reproducible from
#     this file alone.

services:
  op-db:
    image: postgres:14-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 24

  op-kv:
    image: redis:7.2.5-alpine
    command: ["redis-server", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 5s
      timeout: 5s
      retries: 24

  op-ch:
    image: clickhouse/clickhouse-server:25.10.2.65
    volumes:
      - ../../self-hosting/clickhouse/clickhouse-config.xml:/etc/clickhouse-server/config.d/op-config.xml:ro
      - ../../self-hosting/clickhouse/clickhouse-user-config.xml:/etc/clickhouse-server/users.d/op-user-config.xml:ro
      - ../../self-hosting/clickhouse/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    environment:
      # Required on this image tag: without it the entrypoint provisions a
      # password for `default` and every connection fails REQUIRED_PASSWORD.
      # Matches self-hosting/docker-compose.template.yml.
      - CLICKHOUSE_SKIP_USER_SETUP=1
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", 'clickhouse-client --query "SELECT 1"']
      interval: 5s
      timeout: 5s
      retries: 24

  # Mirrors self-hosting/docker-compose.template.yml's op-rp: same image, same
  # single-node sizing (not the root docker-compose.yml's 1G dev cap). Bootstrap
  # config is the checked-in dev file (partitions=24, same as cloud) rather than
  # the self-host setup script's generated one, which doesn't exist until
  # `openpanel init` has run — keeps this stack reproducible from this file alone.
  op-rp:
    image: redpandadata/redpanda:v25.1.4
    command:
      - redpanda
      - start
      - --kafka-addr=internal://0.0.0.0:9092
      - --advertise-kafka-addr=internal://op-rp:9092
      - --rpc-addr=0.0.0.0:33145
      - --advertise-rpc-addr=op-rp:33145
      - --smp=1
      - --memory=2G
      - --default-log-level=info
    volumes:
      - ../../docker/redpanda/bootstrap.yaml:/etc/redpanda/.bootstrap.yaml:ro
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health", "--exit-when-healthy"]
      interval: 5s
      timeout: 5s
      retries: 24

  op-api:
    image: ${OP_API_IMAGE:-openpanel-smoke-image-unset}
    command: >
      sh -c "
        echo 'Running migrations...'
        cd /app/packages/db && bunx prisma@6.14.0 migrate deploy
        cd /app/packages/core && bun scripts/migrate-code.ts

        cd /app/apps/api && bun run start
      "
    ports:
      - "3333:3000"
    environment: &app_env
      NODE_ENV: production
      SELF_HOSTED: "true"
      BATCH_SIZE: "5000"
      BATCH_INTERVAL: "10000"
      ALLOW_REGISTRATION: "true"
      ALLOW_INVITATION: "true"
      REDIS_URL: redis://op-kv:6379
      CLICKHOUSE_URL: http://op-ch:8123/openpanel
      DATABASE_URL: postgresql://postgres:postgres@op-db:5432/postgres?schema=public
      DATABASE_URL_DIRECT: postgresql://postgres:postgres@op-db:5432/postgres?schema=public
      DASHBOARD_URL: http://localhost:3000
      API_URL: http://localhost:3333
      COOKIE_SECRET: smoke-test-cookie-secret-not-a-real-secret
      EMAIL_SENDER: smoke@example.com
      RESEND_API_KEY: re_smoke_test_key
      KAFKA_BROKERS: op-rp:9092
      KAFKA_EVENTS_TOPIC_PARTITIONS: "24"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/healthcheck || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 36
    depends_on:
      op-db:
        condition: service_healthy
      op-ch:
        condition: service_healthy
      op-kv:
        condition: service_healthy
      op-rp:
        condition: service_healthy

  op-dashboard:
    image: ${OP_DASHBOARD_IMAGE:-openpanel-smoke-image-unset}
    ports:
      - "3000:3000"
    environment: *app_env
    # NOTE: this healthcheck is intentionally NOT the smoke assertion.
    # /api/healthcheck is a bare handler that returns new Response('OK') without
    # rendering a page, so it stays green even when every SSR route 500s — which
    # is exactly how a fully broken dashboard once looked healthy to compose.
    # smoke.sh asserts on a real rendered route instead.
    healthcheck:
      test:
        ["CMD-SHELL", "curl -f http://localhost:3000/api/healthcheck || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 36
    depends_on:
      op-api:
        condition: service_healthy

  # M9-003 deleted apps/worker: the worker role is the SAME image as the api,
  # run as ROLE=worker (apps/api/Dockerfile's CMD picks the half). There is no
  # separate worker image to resolve any more.
  op-worker:
    image: ${OP_API_IMAGE:-openpanel-smoke-image-unset}
    ports:
      - "9999:3000"
    environment:
      <<: *app_env
      ROLE: worker
    # V2 serves /healthz/ready, not V1's deep /healthcheck (that one lands with
    # the real clients at M9-004). Same probe the controller's boot harness uses.
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/healthz/ready || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 36
    depends_on:
      op-api:
        condition: service_healthy
      op-rp:
        condition: service_healthy
