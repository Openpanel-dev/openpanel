name: WASL Docker Build

on:
  workflow_dispatch:
    inputs:
      app:
        description: "App to build (api/worker share the backend image, dashboard, all)"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - api
          - worker
          - dashboard

permissions:
  contents: read

env:
  registry: ${{ secrets.OCIR_REGISTRY }}
  username: ${{ secrets.OCIR_USERNAME }}
  password: ${{ secrets.OCIR_PASSWORD }}

jobs:
  generate-tag:
    if: ${{ github.repository == 'naver-innovation/openpanel' }}
    runs-on: [arc-amd64]
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Generate dated tag
        id: tag
        run: |
          DATE_TAG=$(date +'%Y%m%d')
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-6)
          echo "image_tag=${DATE_TAG}-${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "Image tag: ${DATE_TAG}-${SHORT_SHA}"

  # API and Worker use the same artifact; keep both image names for existing deployments.
  build-backend:
    name: Backend (API and Worker)
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    needs: generate-tag
    if: ${{ inputs.app == 'all' || inputs.app == 'api' || inputs.app == 'worker' }}
    runs-on: [arc-amd64]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to OCIR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.registry }}
          username: ${{ env.username }}
          password: ${{ env.password }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.registry }}/wasl-openpanel-api:${{ needs.generate-tag.outputs.image_tag }}
            ${{ env.registry }}/wasl-openpanel-worker:${{ needs.generate-tag.outputs.image_tag }}
          build-args: |
            DATABASE_URL=postgresql://dummy:dummy@localhost:5432/dummy

  build-dashboard:
    name: Dashboard
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    needs: generate-tag
    if: ${{ inputs.app == 'all' || inputs.app == 'dashboard' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to OCIR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.registry }}
          username: ${{ env.username }}
          password: ${{ env.password }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/start/Dockerfile
          push: true
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.registry }}/wasl-openpanel-dashboard:${{ needs.generate-tag.outputs.image_tag }}
