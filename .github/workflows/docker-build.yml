name: Docker Build and Push

on:
  workflow_dispatch:
  push:
    # Branches only: the self-hosting tag has its own workflow, and the v* tags
    # this workflow pushes must not start another build.
    branches:
      - "**"
    paths-ignore:
      # README and docs
      - "**/README*"
      - "**/readme*"
      - "**/*.md"
      - "**/docs/**"
      - "**/CHANGELOG*"
      - "**/LICENSE*"
      # SDKs published to npm and not in the images. @openpanel/ai and
      # @openpanel/sdk are left out of this list: core imports them, so the
      # api image ships them and a change there needs the build and smoke.
      - "packages/sdks/_info/**"
      - "packages/sdks/astro/**"
      - "packages/sdks/express/**"
      - "packages/sdks/nextjs/**"
      - "packages/sdks/nuxt/**"
      - "packages/sdks/react-native/**"
      - "packages/sdks/web/**"
      # Public app (docs/marketing, not part of Docker deploy)
      - "apps/public/**"
      # Dev / tooling
      - "**/.vscode/**"
      - "**/.cursor/**"
      - "**/.env.example"
      - "**/.env.*.example"
      - "**/.gitignore"
      - "**/.eslintignore"
      - "**/.prettierignore"

# Read-only by default; the jobs that push images or tags widen it themselves.
permissions:
  contents: read

# A newer push to a branch supersedes the run still in flight. Main is left
# out: its runs must overlap so `settle` below can debounce them.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && github.run_id || format('build-{0}', github.ref) }}
  cancel-in-progress: true

env:
  repo_owner: "openpanel-dev"

# Shape of a run: `check`, `test` and `build` start together; `smoke` boots
# what `build` produced. On a branch that is the whole run. On main, `merge`
# tags the images once everything is green and `version` turns the run into a
# release build.
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      # Formatting and import order only. `bun run lint` (the full rule set) still reports errors that need a human
      # decision, so it is not a gate yet; this half is green and catches drift today.
      - name: Check formatting
        run: bun run lint:format

      - name: Run TypeScript checks
        run: bun run typecheck

      # dependency-cruiser keeps the dissolved validation/constants/common/json packages from growing back. Run standalone,
      # not via `bun run check`, so a lint error cannot mask a dependency-boundary break.
      - name: Check dependency boundaries
        run: bun run check:deps

      # The self-hosting CLI keeps its own lockfile (it ships as a binary, not
      # as a workspace package), so it installs and tests on its own.
      - name: Test the self-hosting CLI
        working-directory: self-hosting/cli
        run: |
          bun install --frozen-lockfile
          bun test

  # packages/core is 200+ files run one process each (`--isolate`), which is
  # most of the suite's time, so it is split across runners with `--shard`;
  # every other workspace fits in one job. Each job has its own databases.
  test:
    name: test (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: core 1/3
            directory: packages/core
            command: bun run test --shard=1/3
          - suite: core 2/3
            directory: packages/core
            command: bun run test --shard=2/3
          - suite: core 3/3
            directory: packages/core
            command: bun run test --shard=3/3
          - suite: everything else
            directory: .
            command: bun run test:rest
            migrate: true
    services:
      postgres:
        image: postgres:16-alpine
        ports:
          # The host port is what test/databases.ts pins, not a free choice.
          - 23432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 23379:6379
        options: >-
          --health-cmd "redis-cli ping || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      clickhouse:
        image: clickhouse/clickhouse-server:26.1.3.52
        ports:
          - 23123:8123
        env:
          CLICKHOUSE_DB: openpanel
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: ""
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
        options: >-
          --health-cmd "wget -qO- http://localhost:8123/ping || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      # Exercises the real migration runners, which the suite does not: tests apply
      # the flat test/clickhouse-schema.sql, so `migrate:deploy` is the only place
      # Prisma's migrate and the ClickHouse code-migrations actually run. Uses its
      # own databases, never the suite's `openpanel_test`.
      - name: Migrate database
        if: matrix.migrate
        run: bun run migrate:deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:23432/postgres?schema=public
          DATABASE_URL_DIRECT: postgresql://postgres:postgres@localhost:23432/postgres?schema=public
          CLICKHOUSE_URL: http://localhost:23123/openpanel
          SELF_HOSTED: "true"

      # Core's preload only pins the URLs so infrastructure-free files run offline, yet many of its database tests
      # assume `openpanel_test` exists, whichever shard they land in.
      - name: Create test databases
        if: matrix.directory == 'packages/core'
        run: bun -e "await (await import('./test/bootstrap-databases.ts')).bootstrapTestDatabases()"

      # No env block, deliberately. Every workspace's test preload pins DATABASE_URL / CLICKHOUSE_URL / REDIS_URL itself;
      # test/bun-preload.ts also creates and migrates the isolated `openpanel_test` databases for the other workspaces.
      # Env set here would be silently overwritten.
      - name: Run tests
        working-directory: ${{ matrix.directory }}
        run: ${{ matrix.command }}

  # Debounce for main: a push within a minute of the previous one cancels its
  # wait, so a burst of merges is built and versioned once, as its newest
  # commit. `[release now]` in the pushed commit, or a manual run, skips the wait.
  settle:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: main-settle
      cancel-in-progress: true
    steps:
      - name: Wait for a quiet minute
        if: github.event_name == 'push' && !contains(github.event.head_commit.message, '[release now]')
        run: sleep 60

  # Pushes by digest only; nothing gets a pullable tag until `merge`. That is
  # why it can start alongside `check` and `test` instead of after them.
  # Branches build amd64 alone, which is all `smoke` boots; main builds both
  # platforms because its images are the ones that ship.
  build:
    permissions:
      packages: write
      contents: read
    needs: [settle]
    # settle is skipped on other branches; a cancelled settle (debounced) stops the run.
    if: ${{ !cancelled() && contains(fromJSON('["success","skipped"]'), needs.settle.result) }}
    strategy:
      fail-fast: false
      matrix:
        app: [api, dashboard]
        platform: ${{ github.ref == 'refs/heads/main' && fromJSON('["linux/amd64", "linux/arm64"]') || fromJSON('["linux/amd64"]') }}
        include:
          - app: api
            dockerfile: apps/api/Dockerfile
            build_args: DATABASE_URL=postgresql://dummy:dummy@localhost:5432/dummy
          - app: dashboard
            dockerfile: apps/start/Dockerfile
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - name: Prepare platform pair
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The layer cache lives in the registry, next to the image, not in the
      # Actions cache: the install layers alone are ~1 GB per build, which
      # kept the 10 GB Actions cache full and evicting, and exporting them
      # there took longer than the build itself. zstd because that 1 GB is
      # compressed on every export and decompressed on every import, and
      # with gzip that took over a minute each way; the image itself keeps
      # its default layers.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          cache-from: type=registry,ref=ghcr.io/${{ env.repo_owner }}/${{ matrix.app }}:buildcache-${{ env.PLATFORM_PAIR }}
          cache-to: type=registry,ref=ghcr.io/${{ env.repo_owner }}/${{ matrix.app }}:buildcache-${{ env.PLATFORM_PAIR }},mode=max,image-manifest=true,oci-mediatypes=true,compression=zstd
          outputs: type=image,name=ghcr.io/${{ env.repo_owner }}/${{ matrix.app }},push-by-digest=true,name-canonical=true,push=true
          build-args: ${{ matrix.build_args }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.app }}-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Boots the images this run produced and asserts they actually serve traffic.
  # Gates `merge`, so a broken image never gets a pullable tag.
  smoke:
    permissions:
      packages: read
      contents: read
    needs: [build]
    # Explicit, because a skipped settle earlier in the chain would otherwise skip this.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # build pushed by digest but has not tagged anything yet, so pull the
      # exact amd64 digests this run produced.
      - name: Download amd64 digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/smoke-digests
          pattern: digests-*-linux-amd64

      - name: Resolve images
        run: |
          set -euo pipefail
          for app in api dashboard; do
            dir="/tmp/smoke-digests/digests-${app}-linux-amd64"
            digest="$(ls "$dir" | head -1)"
            if [ -z "$digest" ]; then
              echo "::error::no digest artifact for $app"
              exit 1
            fi
            image="ghcr.io/${{ env.repo_owner }}/${app}@sha256:${digest}"
            echo "$app -> $image"
            echo "OP_$(echo "$app" | tr '[:lower:]' '[:upper:]')_IMAGE=$image" >> "$GITHUB_ENV"
          done

      - name: Smoke test the stack
        run: .github/smoke/smoke.sh

      - name: Tear down
        if: always()
        run: docker compose -f .github/smoke/docker-compose.yml down -v || true

  # Main only: a branch's images are smoke-tested and then left untagged.
  merge:
    permissions:
      packages: write
      contents: read
    needs: [check, test, build, smoke]
    if: ${{ github.ref == 'refs/heads/main' && !cancelled() && needs.check.result == 'success' && needs.test.result == 'success' && needs.smoke.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        app: [api, dashboard]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.app }}-*
          merge-multiple: true

      - name: Generate tags
        id: tags
        run: |
          BRANCH_NAME=$(echo "${{ github.ref_name }}" | sed 's/\//-/g')
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-4)
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t ghcr.io/${{ env.repo_owner }}/${{ matrix.app }}:${{ steps.tags.outputs.branch_name }}-${{ steps.tags.outputs.short_sha }} \
            $(printf 'ghcr.io/${{ env.repo_owner }}/${{ matrix.app }}@sha256:%s ' *)

  # Every build on main gets the next version: the git tag vX.Y.Z and the image
  # tags X.Y.Z, X.Y and X, taken from this run's own digests. One run at a time,
  # so two versions are never computed from the same last tag.
  version:
    if: ${{ github.ref == 'refs/heads/main' && !cancelled() && needs.merge.result == 'success' }}
    needs: [merge]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: main-version
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"

      - run: bun install --frozen-lockfile --filter @openpanel/release

      - name: Decide the version
        id: next
        run: bun tooling/release/src/next-version.ts "$GITHUB_SHA"

      - name: Download digests
        if: steps.next.outputs.skip != 'true'
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*

      - uses: docker/setup-buildx-action@v4
        if: steps.next.outputs.skip != 'true'

      - uses: docker/login-action@v4
        if: steps.next.outputs.skip != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the images
        if: steps.next.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.next.outputs.version }}
          MINOR: ${{ steps.next.outputs.minor }}
          MAJOR: ${{ steps.next.outputs.major }}
        run: |
          set -euo pipefail
          for app in api dashboard; do
            image="ghcr.io/$repo_owner/$app"
            # One file per platform, named after that platform's digest.
            sources=()
            for file in /tmp/digests/digests-"$app"-*/*; do
              sources+=("$image@sha256:$(basename "$file")")
            done
            docker buildx imagetools create -t "$image:$VERSION" -t "$image:$MINOR" -t "$image:$MAJOR" "${sources[@]}"
            echo "$image: $VERSION, $MINOR, $MAJOR"
          done

      # Pushed with GITHUB_TOKEN, which starts no workflow of its own.
      - name: Tag the commit
        if: steps.next.outputs.skip != 'true' && steps.next.outputs.is_new == 'true'
        env:
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          git tag "v$VERSION" "$GITHUB_SHA"
          git push origin "v$VERSION"

      # Linux only: self-hosting runs on Linux servers, and bun cross-compiles
      # both architectures here in seconds.
      - name: Build the CLI
        if: steps.next.outputs.skip != 'true'
        working-directory: self-hosting/cli
        env:
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          for target in linux-x64 linux-arm64; do
            bun build --compile --target="bun-$target" --define "OPENPANEL_RELEASE_VERSION=\"$VERSION\"" src/main.ts --outfile "dist/openpanel-$target"
          done
          test "$(./dist/openpanel-linux-x64 --version)" = "$VERSION"
          (cd dist && sha256sum openpanel-* > checksums.txt)

      # Supporters install and self-update from these; public installs ignore
      # pre-releases until the self-hosting tag promotes one.
      - name: Publish the build as a pre-release
        if: steps.next.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          set -euo pipefail
          files=(self-hosting/cli/dist/openpanel-* self-hosting/cli/dist/checksums.txt)
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" "${files[@]}" --clobber
          else
            gh release create "v$VERSION" "${files[@]}" --verify-tag --prerelease \
              --title "OpenPanel $VERSION (build)" \
              --notes "Build of main at $GITHUB_SHA. Supporters get it with \`openpanel upgrade --supporter\`; public releases are published from the self-hosting tag."
          fi

      # One pre-release per build adds up; keep the newest ten. Tags stay, and a
      # public release is never a pre-release, so it is never touched.
      - name: Remove old pre-releases
        if: steps.next.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: "10"
        run: |
          gh release list --limit 200 --json tagName,isPrerelease,createdAt \
            --jq "[.[] | select(.isPrerelease)] | sort_by(.createdAt) | reverse | .[$KEEP:] | .[].tagName" \
            | while read -r tag; do gh release delete "$tag" --yes; done
