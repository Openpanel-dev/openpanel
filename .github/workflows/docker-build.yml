name: Docker Build and Push

on:
  workflow_dispatch:
  push:
    # Branches only: the self-hosting tag has its own workflow, and the v* tags
    # this workflow pushes must not start another build.
    branches:
      - "**"
    paths-ignore:
      # README and docs
      - "**/README*"
      - "**/readme*"
      - "**/*.md"
      - "**/docs/**"
      - "**/CHANGELOG*"
      - "**/LICENSE*"
      # SDKs (published separately)
      - "packages/sdks/**"
      # Public app (docs/marketing, not part of Docker deploy)
      - "apps/public/**"
      # Dev / tooling
      - "**/.vscode/**"
      - "**/.cursor/**"
      - "**/.env.example"
      - "**/.env.*.example"
      - "**/.gitignore"
      - "**/.eslintignore"
      - "**/.prettierignore"

env:
  repo_owner: "openpanel-dev"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        ports:
          # The host port is what test/databases.ts pins, not a free choice.
          - 23432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 23379:6379
        options: >-
          --health-cmd "redis-cli ping || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      clickhouse:
        image: clickhouse/clickhouse-server:26.1.3.52
        ports:
          - 23123:8123
        env:
          CLICKHOUSE_DB: openpanel
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: ""
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
        options: >-
          --health-cmd "wget -qO- http://localhost:8123/ping || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # .nvmrc is the source of truth; keep ARG NODE_VERSION in
          # apps/*/Dockerfile in sync with it. Must stay >=22.19.0:
          # undici@8 fails at import on older Node with
          # "webidl.util.markAsUncloneable is not a function".
          node-version-file: ".nvmrc"

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          # .bun-version is the pin's home and apps/api/src/config/bun-version.test.ts asserts an exact match, so read it
          # rather than keeping a second copy here.
          bun-version-file: ".bun-version"

      - name: Setup bun cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Codegen
        run: bun run codegen

      # Formatting and import order only. `bun run lint` (the full rule set) still reports errors that need a human
      # decision, so it is not a gate yet; this half is green and catches drift today.
      - name: Check formatting
        run: bun run lint:format

      - name: Run TypeScript checks
        run: bun run typecheck

      # dependency-cruiser keeps the dissolved validation/constants/common/json packages from growing back. Run standalone,
      # not via `bun run check`, so a lint error cannot mask a dependency-boundary break.
      - name: Check dependency boundaries
        run: bun run check:deps

      # Exercises the real migration runners, which the suite does not: tests apply
      # the flat test/clickhouse-schema.sql, so `migrate:deploy` is the only place
      # Prisma's migrate and the ClickHouse code-migrations actually run. Uses its
      # own databases, never the suite's `openpanel_test`.
      - name: Migrate database
        run: bun run migrate:deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:23432/postgres?schema=public
          DATABASE_URL_DIRECT: postgresql://postgres:postgres@localhost:23432/postgres?schema=public
          CLICKHOUSE_URL: http://localhost:23123/openpanel
          SELF_HOSTED: "true"

      # No env block, deliberately. Every workspace's test preload pins DATABASE_URL / CLICKHOUSE_URL / REDIS_URL itself and
      # creates and migrates the isolated `openpanel_test` databases (test/bun-preload.ts, packages/core/test/preload.ts).
      # Env set here would be silently overwritten.
      - name: Run tests
        run: bun run test

      # The self-hosting CLI keeps its own lockfile (it ships as a binary, not
      # as a workspace package), so it installs and tests on its own.
      - name: Test the self-hosting CLI
        working-directory: self-hosting/cli
        run: |
          bun install --frozen-lockfile
          bun test

  # Debounce for main: a push within a minute of the previous one cancels its
  # wait, so a burst of merges is built and versioned once, as its newest
  # commit. `[release now]` in the pushed commit, or a manual run, skips the wait.
  settle:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: main-settle
      cancel-in-progress: true
    steps:
      - name: Wait for a quiet minute
        if: github.event_name == 'push' && !contains(github.event.head_commit.message, '[release now]')
        run: sleep 60

  build-api:
    permissions:
      packages: write
      contents: read
    needs: [lint-and-test, settle]
    # settle is skipped on other branches; a cancelled settle (debounced) stops the run.
    if: ${{ !cancelled() && needs.lint-and-test.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.settle.result) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Prepare platform pair
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=api-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=api-${{ env.PLATFORM_PAIR }}
          outputs: type=image,name=ghcr.io/${{ env.repo_owner }}/api,push-by-digest=true,name-canonical=true,push=true
          build-args: |
            DATABASE_URL=postgresql://dummy:dummy@localhost:5432/dummy

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-api-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Boots the images this run produced and asserts they actually serve traffic.
  # Gates every merge-* job below, so a broken image never gets a pullable tag.
  smoke:
    permissions:
      packages: read
      contents: read
    needs: [build-api, build-dashboard]
    # Explicit, because a skipped settle earlier in the chain would otherwise skip this.
    if: ${{ !cancelled() && needs.build-api.result == 'success' && needs.build-dashboard.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # build-* pushed by digest but has not tagged anything yet, so pull the
      # exact amd64 digests this run produced.
      - name: Download amd64 digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/smoke-digests
          pattern: digests-*-linux-amd64

      - name: Resolve images
        run: |
          set -euo pipefail
          for app in api dashboard; do
            dir="/tmp/smoke-digests/digests-${app}-linux-amd64"
            digest="$(ls "$dir" | head -1)"
            if [ -z "$digest" ]; then
              echo "::error::no digest artifact for $app"
              exit 1
            fi
            image="ghcr.io/${{ env.repo_owner }}/${app}@sha256:${digest}"
            echo "$app -> $image"
            echo "OP_$(echo "$app" | tr '[:lower:]' '[:upper:]')_IMAGE=$image" >> "$GITHUB_ENV"
          done

      - name: Smoke test the stack
        run: .github/smoke/smoke.sh

      - name: Tear down
        if: always()
        run: docker compose -f .github/smoke/docker-compose.yml down -v || true

  merge-api:
    permissions:
      packages: write
      contents: read
    needs: [build-api, smoke]
    if: ${{ !cancelled() && needs.build-api.result == 'success' && needs.smoke.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-api-*
          merge-multiple: true

      - name: Generate tags
        id: tags
        run: |
          BRANCH_NAME=$(echo "${{ github.ref_name }}" | sed 's/\//-/g')
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-4)
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t ghcr.io/${{ env.repo_owner }}/api:${{ steps.tags.outputs.branch_name }}-${{ steps.tags.outputs.short_sha }} \
            $(printf 'ghcr.io/${{ env.repo_owner }}/api@sha256:%s ' *)

  build-dashboard:
    permissions:
      packages: write
      contents: read
    needs: [lint-and-test, settle]
    if: ${{ !cancelled() && needs.lint-and-test.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.settle.result) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Prepare platform pair
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/start/Dockerfile
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=dashboard-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=dashboard-${{ env.PLATFORM_PAIR }}
          outputs: type=image,name=ghcr.io/${{ env.repo_owner }}/dashboard,push-by-digest=true,name-canonical=true,push=true
          build-args: |
            NO_CLOUDFLARE=1

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-dashboard-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-dashboard:
    permissions:
      packages: write
      contents: read
    needs: [build-dashboard, smoke]
    if: ${{ !cancelled() && needs.build-dashboard.result == 'success' && needs.smoke.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-dashboard-*
          merge-multiple: true

      - name: Generate tags
        id: tags
        run: |
          BRANCH_NAME=$(echo "${{ github.ref_name }}" | sed 's/\//-/g')
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-4)
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t ghcr.io/${{ env.repo_owner }}/dashboard:${{ steps.tags.outputs.branch_name }}-${{ steps.tags.outputs.short_sha }} \
            $(printf 'ghcr.io/${{ env.repo_owner }}/dashboard@sha256:%s ' *)

  # Every build on main gets the next version: the git tag vX.Y.Z and the image
  # tags X.Y.Z, X.Y and X, taken from this run's own digests. One run at a time,
  # so two versions are never computed from the same last tag.
  version:
    if: ${{ github.ref == 'refs/heads/main' && !cancelled() && needs.merge-api.result == 'success' && needs.merge-dashboard.result == 'success' }}
    needs: [merge-api, merge-dashboard]
    runs-on: ubuntu-latest
    concurrency:
      group: main-version
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"

      - run: bun install --frozen-lockfile --filter @openpanel/release

      - name: Decide the version
        id: next
        run: bun tooling/release/src/next-version.ts "$GITHUB_SHA"

      - name: Download digests
        if: steps.next.outputs.skip != 'true'
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*

      - uses: docker/setup-buildx-action@v3
        if: steps.next.outputs.skip != 'true'

      - uses: docker/login-action@v3
        if: steps.next.outputs.skip != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the images
        if: steps.next.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.next.outputs.version }}
          MINOR: ${{ steps.next.outputs.minor }}
          MAJOR: ${{ steps.next.outputs.major }}
        run: |
          set -euo pipefail
          for app in api dashboard; do
            image="ghcr.io/$repo_owner/$app"
            # One file per platform, named after that platform's digest.
            sources=()
            for file in /tmp/digests/digests-"$app"-*/*; do
              sources+=("$image@sha256:$(basename "$file")")
            done
            docker buildx imagetools create -t "$image:$VERSION" -t "$image:$MINOR" -t "$image:$MAJOR" "${sources[@]}"
            echo "$image: $VERSION, $MINOR, $MAJOR"
          done

      # Pushed with GITHUB_TOKEN, which starts no workflow of its own.
      - name: Tag the commit
        if: steps.next.outputs.skip != 'true' && steps.next.outputs.is_new == 'true'
        env:
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          git tag "v$VERSION" "$GITHUB_SHA"
          git push origin "v$VERSION"

      # Linux only: self-hosting runs on Linux servers, and bun cross-compiles
      # both architectures here in seconds.
      - name: Build the CLI
        if: steps.next.outputs.skip != 'true'
        working-directory: self-hosting/cli
        env:
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          for target in linux-x64 linux-arm64; do
            bun build --compile --target="bun-$target" --define "OPENPANEL_RELEASE_VERSION=\"$VERSION\"" src/main.ts --outfile "dist/openpanel-$target"
          done
          test "$(./dist/openpanel-linux-x64 --version)" = "$VERSION"
          (cd dist && sha256sum openpanel-* > checksums.txt)

      # Supporters install and self-update from these; public installs ignore
      # pre-releases until the self-hosting tag promotes one.
      - name: Publish the build as a pre-release
        if: steps.next.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          set -euo pipefail
          files=(self-hosting/cli/dist/openpanel-* self-hosting/cli/dist/checksums.txt)
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" "${files[@]}" --clobber
          else
            gh release create "v$VERSION" "${files[@]}" --verify-tag --prerelease \
              --title "OpenPanel $VERSION (build)" \
              --notes "Build of main at $GITHUB_SHA. Supporters get it with \`openpanel upgrade --supporter\`; public releases are published from the self-hosting tag."
          fi

      # One pre-release per build adds up; keep the newest ten. Tags stay, and a
      # public release is never a pre-release, so it is never touched.
      - name: Remove old pre-releases
        if: steps.next.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: "10"
        run: |
          gh release list --limit 200 --json tagName,isPrerelease,createdAt \
            --jq "[.[] | select(.isPrerelease)] | sort_by(.createdAt) | reverse | .[$KEEP:] | .[].tagName" \
            | while read -r tag; do gh release delete "$tag" --yes; done
