name: CLI release

# Pushing a `cli-vX.Y.Z` tag builds the self-hosting CLI for every platform and
# attaches the binaries plus a checksums.txt to a GitHub release. The install
# script and `openpanel upgrade` both verify those checksums before replacing
# anything, so the asset names below are a contract with self-hosting/install.sh
# and self-hosting/cli/src/self-update.ts.
on:
  push:
    tags:
      - "cli-v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - { target: linux-x64, runner: ubuntu-latest, smoke: true }
          - { target: linux-arm64, runner: ubuntu-latest, smoke: false }
          # macOS binaries are built and signed on macOS: an unsigned binary is
          # killed on launch on Apple Silicon.
          - { target: darwin-arm64, runner: macos-latest, smoke: true }
          - { target: darwin-x64, runner: macos-latest, smoke: false }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: self-hosting/cli
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"

      - run: bun install --frozen-lockfile

      - run: bun test

      # The tag is the release's only version label, but the binary reports the
      # one in package.json; a mismatch would make `upgrade` loop forever.
      - name: Check the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#cli-v}"
          version="$(bun -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "Tag says $tag but package.json says $version" >&2
            exit 1
          fi

      - name: Build
        run: bun build --compile --target="bun-${{ matrix.target }}" src/main.ts --outfile "dist/openpanel-${{ matrix.target }}"

      - name: Sign (ad hoc)
        if: runner.os == 'macOS'
        run: |
          codesign --force --sign - "dist/openpanel-${{ matrix.target }}"
          codesign --verify --verbose "dist/openpanel-${{ matrix.target }}"

      # Only where the runner can execute the target natively.
      - name: Smoke test
        if: matrix.smoke
        run: |
          test "$("./dist/openpanel-${{ matrix.target }}" --version)" = "${GITHUB_REF_NAME#cli-v}"

      - uses: actions/upload-artifact@v4
        with:
          name: openpanel-${{ matrix.target }}
          path: self-hosting/cli/dist/openpanel-${{ matrix.target }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: openpanel-*
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          chmod +x openpanel-*
          sha256sum openpanel-* > checksums.txt
          cat checksums.txt

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/openpanel-* dist/checksums.txt --repo "$GITHUB_REPOSITORY" --generate-notes --title "CLI ${GITHUB_REF_NAME#cli-v}"
