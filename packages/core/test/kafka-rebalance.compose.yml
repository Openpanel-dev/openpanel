# Dedicated test stack; don't run alongside another stack on these ports.
services:
  kafka:
    image: apache/kafka:3.9.1
    ports:
      - 127.0.0.1:29092:9092
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: -Xms128m -Xmx256m
    healthcheck:
      test: [CMD-SHELL, /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1]
      interval: 5s
      timeout: 10s
      retries: 20
  redis:
    image: redis:7.2.5-alpine
    command: [redis-server, --appendonly, 'yes', --appendfsync, always]
    ports:
      - 127.0.0.1:23379:6379
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 2s
      retries: 10
  clickhouse:
    image: clickhouse/clickhouse-server:26.1.3.52
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: 1
    ports:
      - 127.0.0.1:23123:8123
    healthcheck:
      test: [CMD, clickhouse-client, --query, SELECT 1]
      interval: 2s
      timeout: 5s
      retries: 20
